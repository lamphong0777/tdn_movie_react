<!-- public/favicon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background: hình vuông noir, không bo góc -->
  <rect width="64" height="64" fill="#0b0b0f"/>

  <!-- Viền vàng mảnh kiểu editorial frame -->
  <rect x="3" y="3" width="58" height="58" fill="none" stroke="#f5c518" stroke-width="1" opacity="0.35"/>

  <!-- Clapperboard top (thanh nghiêng) -->
  <g>
    <!-- Thanh clapper chính -->
    <path d="M 12 18 L 52 14 L 52 22 L 12 26 Z" fill="#f5c518"/>
    <!-- Răng cưa clapper (các ô đen) -->
    <path d="M 18 17.5 L 22 17.1 L 22 25.6 L 18 26 Z" fill="#0b0b0f"/>
    <path d="M 28 16.5 L 32 16.1 L 32 24.6 L 28 25 Z" fill="#0b0b0f"/>
    <path d="M 38 15.5 L 42 15.1 L 42 23.6 L 38 24 Z" fill="#0b0b0f"/>
    <path d="M 48 14.5 L 52 14.1 L 52 22.6 L 48 23 Z" fill="#0b0b0f"/>
  </g>

  <!-- Thân clapper (board chính) -->
  <rect x="12" y="26" width="40" height="28" fill="#14141a" stroke="#f5c518" stroke-width="1.5"/>

  <!-- Chữ V lớn — biểu tượng VSMOV -->
  <g transform="translate(32, 43)">
    <text
      x="0" y="0"
      text-anchor="middle"
      dominant-baseline="middle"
      font-family="'Playfair Display', Georgia, serif"
      font-size="22"
      font-weight="900"
      font-style="italic"
      fill="#f5c518"
    >V</text>
  </g>

  <!-- Dấu chấm đỏ góc trên phải kiểu "recording" -->
  <circle cx="52" cy="12" r="2.5" fill="#f5c518"/>
</svg>